services:
  node:
    image: ghcr.io/foundry-rs/foundry:stable
    command: anvil --host 0.0.0.0 --port 8545 --chain-id ${CHAIN_ID:-31337} --block-time 2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RPC_PORT:-8545}:8545"
    volumes:
      - anvil-data:/root/.foundry/anvil

volumes:
  anvil-data:
